
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y
CONFIG_CONSOLE_GETCHAR_BUFSIZE=64
CONFIG_CONSOLE_PUTCHAR_BUFSIZE=512

CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_ESP_SPIRAM=y
CONFIG_ESP32S3_DATA_CACHE_16KB=y

CONFIG_ESP_SPIRAM_HEAP_SIZE=524288
CONFIG_SHARED_MULTI_HEAP=y
CONFIG_ST730X_CONV_BUFFER_LINE_CNT=32
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ADC=y


# SDCARD 
#
CONFIG_SDHC=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SD_DATA_TIMEOUT=100
CONFIG_SD_RETRY_COUNT=5


# FILE SYSTEM
#
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_REENTRANT=y


# LCD
#
CONFIG_DISPLAY=y
CONFIG_SPI=y
CONFIG_MIPI_DBI=y


# 네트워킹 기본 활성화
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y

CONFIG_POSIX_API=y
CONFIG_ZVFS_OPEN_MAX=12


CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y

# ESP32 Wi-Fi 하드웨어 드라이버 활성화
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y

# IP 스택 및 DHCPv4 활성화 (접속 후 IP를 자동으로 받기 위함)
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y

# 내부 관리 네트워킹 레이어 활성화
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

# 로그 출력 활성화 (디버깅용)
CONFIG_NET_LOG=y

CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_REBOOT=y

# SNTP 네트워크 시간 보정 프로토콜 활성화
CONFIG_SNTP=y
CONFIG_POSIX_API=y

# DNS 도메인 해석이 필요한 경우
CONFIG_DNS_RESOLVER=y